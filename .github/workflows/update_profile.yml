name: Update Profile

on:
  push:
    branches:
      - main
  workflow_dispatch: # Erlaubt den manuellen Start über die GitHub-Website
  schedule:
    - cron: '0 0 * * *' # Führt das Skript jeden Tag um Mitternacht UTC aus

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Python Script für SVG-Header
        run: python generate_header.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.svg
          
          # Prüft, ob sich die SVGs verändert haben. Wenn ja -> Commit & Push
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate SVGs" && git push)
