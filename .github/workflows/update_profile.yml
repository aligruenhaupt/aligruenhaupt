name: Generate Profile SVG

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# HIER IST DER FIX FÜR FEHLER 128:
# Gibt dem Bot die explizite Erlaubnis, neue Dateien in dein Repo zu pushen
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5 # Update auf v5 löst die Node.js Warnung

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python Skript ausführen
        run: python scripts/generate_svg.py

      - name: Generierte SVG committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile_art.svg
          
          # Nur pushen, wenn es wirklich Änderungen gab
          git commit -m "chore: update profile SVG art" || exit 0
          git push