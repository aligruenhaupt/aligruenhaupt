<svg width="800" height="756" xmlns="http://www.w3.org/2000/svg">
    <style>
        .ascii-line {
            font-family: 'Courier New', monospace;
            font-size: 10px;
            fill: #c9d1d9; /* Helles GitHub-Grau */
            white-space: pre;
            opacity: 0;
            animation: fadeIn 0.1s forwards;
        }
        .status {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            fill: #58a6ff; /* GitHub-Blau */
            opacity: 0;
            animation: fadeIn 1s forwards;
            animation-delay: 2.24s; /* Erscheint ganz am Schluss */
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
    
    <!-- Transparenter oder dunkler Hintergrund -->
